<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تحدي الإحداثيات - Move by Move</title>
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* --- متغيرات الألوان المتطابقة مع غرف اللعب وإضافة ألوان المساعد --- */
        body.theme-royal { --bg-color: #D2D2D6; --panel-bg: #F4F1EA; --border-color: #C9A86A; --text-main: #0B174D; --text-muted: #2C447F; --board-light: #F4F1EA; --board-dark: #1A2E73; --primary-color: #0B174D; --primary-hover: #1A2E73; --danger-color: #A8834C; --timer-bg: #F4F1EA; --timer-border: #C9A86A; --helper-glow: rgba(201, 168, 106, 0.95); }
        body.theme-modern { --bg-color: #0f172a; --panel-bg: #1e293b; --border-color: #334155; --text-main: #f8fafc; --text-muted: #94a3b8; --board-light: #cbd5e1; --board-dark: #475569; --primary-color: #3b82f6; --primary-hover: #2563eb; --danger-color: #ef4444; --timer-bg: #0f172a; --timer-border: #334155; --helper-glow: rgba(59, 130, 246, 0.95); }
        body.theme-classic { --bg-color: #ebecd0; --panel-bg: #ffffff; --border-color: #dcdcdc; --text-main: #2b2b2b; --text-muted: #737373; --board-light: #ebecd0; --board-dark: #739552; --primary-color: #81b64c; --primary-hover: #6a9c3d; --danger-color: #fa4b4b; --timer-bg: #f8f8f8; --timer-border: #cccccc; --helper-glow: rgba(250, 75, 75, 0.95); }

        * { box-sizing: border-box; font-family: 'Tajawal', 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 8px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; user-select: none; transition: background-color 0.3s ease; }
        .container { width: 100%; max-width: 600px; display: flex; flex-direction: column; align-items: center; }

        /* الشريط العلوي */
        .top-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 12px; background: var(--panel-bg); padding: 8px 15px; border-radius: 12px; border: 2px solid var(--border-color); }
        .top-bar h2 { margin: 0; font-weight: 900; font-size: 1.2rem; color: var(--text-main); }
        .header-controls { display: flex; gap: 8px; }
        select.modern-select, button.lang-btn { background: var(--bg-color); color: var(--text-main); border: 2px solid var(--border-color); border-radius: 8px; padding: 5px 10px; font-weight: 800; outline: none; cursor: pointer; font-size: 0.9rem; }

        /* الأزرار العلوية */
        .pills-container { display: flex; justify-content: space-between; width: 100%; gap: 8px; margin-bottom: 10px; }
        .pill-btn { background: var(--panel-bg); color: var(--text-muted); border: 2px solid var(--border-color); padding: 8px 5px; border-radius: 20px; cursor: pointer; font-weight: 800; font-size: 0.9rem; text-align: center; flex: 1; transition: 0.1s; }
        .pill-btn.selected { background: var(--primary-color); color: #ffffff; border-color: var(--primary-color); }

        /* الرقعة */
        .board-wrapper { width: 100% !important; aspect-ratio: 1 / 1; margin: 0 auto; border-radius: 6px; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.2); position: relative; border: 2px solid var(--border-color); touch-action: none !important; }
        #board { width: 100% !important; }
        .white-1e1d7 { background-color: var(--board-light) !important; color: var(--board-dark) !important; }
        .black-3c85d { background-color: var(--board-dark) !important; color: var(--board-light) !important; }

        /* --- الإحداثية داخل الرقعة بدون تظليل خلفي، مع تحديد (Stroke) حول النص --- */
        #target-overlay { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            font-size: 6.5rem; 
            font-weight: 900; 
            color: #ffffff; 
            font-family: 'Inter', monospace; 
            letter-spacing: 2px; 
            text-transform: lowercase;
            pointer-events: none; 
            z-index: 20; 
            display: none;
            /* إنشاء حدود للنص ليكون مرئياً بوضوح على اللونين الأبيض والأسود */
            text-shadow: 
                3px 3px 0 var(--primary-color),
                -3px -3px 0 var(--primary-color),
                3px -3px 0 var(--primary-color),
                -3px 3px 0 var(--primary-color),
                0px 8px 20px rgba(0,0,0,0.5);
        }

        /* ألوان النقر والمساعد */
        .correct { background-color: rgba(74, 222, 128, 0.85) !important; z-index: 5;}
        .wrong { background-color: rgba(239, 68, 68, 0.85) !important; z-index: 5;}
        
        /* إضاءة المساعد (متناسقة مع الثيم) */
        .glow { box-shadow: inset 0 0 0 5px var(--helper-glow) !important; z-index: 5;}

        /* العدادات */
        .stats-container { display: flex; justify-content: space-between; width: 100%; margin-top: 15px; gap: 10px; }
        .stat-box { flex: 1; background: var(--timer-bg); border: 2px solid var(--timer-border); border-radius: 12px; padding: 12px; text-align: center; }
        .stat-label { color: var(--text-muted); font-size: 0.9rem; font-weight: 900; margin-bottom: 5px; text-transform: uppercase; }
        .stat-value { font-family: 'Inter', monospace; font-size: 2.2rem; color: var(--text-main); font-weight: 900; line-height: 1; }

        /* الأزرار الرئيسية */
        .controls-container { width: 100%; margin-top: 15px; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 12px; font-size: 1.2rem; font-weight: 900; cursor: pointer; display: flex; justify-content: center; align-items: center; }
        .btn-primary { background: var(--primary-color); color: #ffffff; }
        .btn-danger { background: var(--danger-color); color: #ffffff; display: none; }

        /* نافذة النهاية */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 200; backdrop-filter: blur(4px); }
        .modal-content { background: var(--panel-bg); border: 2px solid var(--border-color); border-radius: 16px; padding: 30px; text-align: center; width: 90%; max-width: 320px; box-shadow: 0 15px 30px rgba(0,0,0,0.3); }
        .modal-content h2 { margin: 0 0 10px 0; font-size: 1.8rem; font-weight: 900; color: var(--text-main); }
        .modal-content .final-score { font-size: 3.5rem; font-weight: 900; color: var(--primary-color); font-family: 'Inter', monospace; margin: 15px 0; line-height: 1; }
        .modal-content p { color: var(--text-muted); font-weight: 700; margin-bottom: 20px; font-size: 1rem; }

        html[dir="ltr"] .stat-label, html[dir="ltr"] .pill-btn, html[dir="ltr"] .btn, html[dir="ltr"] h2, html[dir="ltr"] p { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="theme-royal">

    <div class="container">
        <!-- الشريط العلوي -->
        <div class="top-bar">
            <h2 data-i18n="title">الإحداثيات</h2>
            <div class="header-controls">
                <select class="modern-select" id="themeChoice" onchange="changeTheme(this.value)">
                    <option value="royal" data-i18n="themeRoyal">ملكي</option>
                    <option value="modern" data-i18n="themeModern">داكن</option>
                    <option value="classic" data-i18n="themeClassic">كلاسيك</option>
                </select>
                <button class="lang-btn" onclick="toggleLanguage()" id="langBtn">EN</button>
            </div>
        </div>

        <!-- الأزرار السريعة -->
        <div class="pills-container" id="time-options">
            <div class="pill-btn selected" onclick="selectTime(30, this)" data-i18n="opt30">30 ثانية</div>
            <div class="pill-btn" onclick="selectTime(0, this)" data-i18n="optInf">مفتوح</div>
            <div class="pill-btn" id="helper-btn" onclick="toggleHelper()" data-i18n="optHelp">المساعد</div>
            <div class="pill-btn" onclick="toggleFlip()" data-i18n="optFlip">تدوير</div>
        </div>

        <!-- الرقعة وبداخلها الهدف المفرغ (بدون صندوق) -->
        <div class="board-wrapper">
            <div id="board"></div>
            <div id="target-overlay">--</div>
        </div>

        <!-- العدادات -->
        <div class="stats-container">
            <div class="stat-box">
                <div class="stat-label" data-i18n="statScore">النقاط</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label" data-i18n="statTime">الوقت</div>
                <div class="stat-value" id="timer">30</div>
            </div>
        </div>

        <!-- الأزرار السفلية -->
        <div class="controls-container">
            <button class="btn btn-primary" id="start-btn" onclick="startGame()" data-i18n="btnStart">إبدأ التحدي</button>
            <button class="btn btn-danger" id="end-btn" onclick="endGame()" data-i18n="btnEnd">إنهاء التحدي</button>
        </div>
    </div>

    <!-- نافذة النهاية -->
    <div class="modal-overlay" id="endModal">
        <div class="modal-content">
            <h2 data-i18n="modalTitle">انتهى الوقت</h2>
            <p data-i18n="modalDesc">الإحداثيات الصحيحة:</p>
            <div class="final-score" id="finalScoreText">0</div>
            <button class="btn btn-primary" onclick="closeModalAndReset()" data-i18n="modalBtn">استمرار</button>
        </div>
    </div>

    <script>
        // --- الترجمة ---
        const dictionary = {
            ar: { title: "الإحداثيات", themeRoyal: "ملكي", themeModern: "داكن", themeClassic: "كلاسيك", opt30: "30 ثانية", optInf: "مفتوح", optHelp: "المساعد", optFlip: "تدوير", statScore: "النقاط", statTime: "الوقت", btnStart: "إبدأ التحدي", btnEnd: "إنهاء التحدي", modalTitle: "انتهى الوقت", modalDesc: "الإحداثيات الصحيحة:", modalBtn: "استمرار" },
            en: { title: "Coordinates", themeRoyal: "Royal", themeModern: "Dark", themeClassic: "Classic", opt30: "30 Sec", optInf: "Infinite", optHelp: "Helper", optFlip: "Flip", statScore: "Score", statTime: "Time", btnStart: "Start Training", btnEnd: "End Training", modalTitle: "Time's Up", modalDesc: "Correct Coordinates:", modalBtn: "Continue" }
        };

        let currentLang = localStorage.getItem('chessLang') || 'ar';
        function applyLanguage(lang) {
            currentLang = lang; localStorage.setItem('chessLang', lang);
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr'; document.documentElement.lang = lang;
            document.getElementById('langBtn').innerText = lang === 'ar' ? 'EN' : 'عربي';
            $('[data-i18n]').each(function() { let key = $(this).attr('data-i18n'); if (dictionary[lang][key]) { if ($(this).is('option')) $(this).text(dictionary[lang][key]); else $(this).text(dictionary[lang][key]); } });
        }
        function toggleLanguage() { applyLanguage(currentLang === 'ar' ? 'en' : 'ar'); }

        // --- الثيمات ---
        const savedTheme = localStorage.getItem('chessTheme') || 'royal';
        document.body.className = 'theme-' + savedTheme; document.getElementById('themeChoice').value = savedTheme;
        function changeTheme(theme) { document.body.className = 'theme-' + theme; localStorage.setItem('chessTheme', theme); }

        // --- متغيرات اللعبة ---
        let score = 0, selectedTime = 30, timeLeft = 30;
        let currentTarget = "", gameActive = false, timerInterval;
        let isFlipped = false, isHelperActive = false, board = null;

        const targetOverlay = document.getElementById('target-overlay');
        const scoreEl = document.getElementById('score');
        const timerEl = document.getElementById('timer');
        const startBtn = document.getElementById('start-btn');
        const endBtn = document.getElementById('end-btn');
        const helperBtn = document.getElementById('helper-btn');
        const optionsGrid = document.getElementById('time-options');
        const endModal = document.getElementById('endModal');

        // --- تهيئة الرقعة ---
        $(document).ready(function() {
            applyLanguage(currentLang);
            var config = { position: 'start', showNotation: true, pieceTheme: function(piece) { return 'https://images.chesscomfiles.com/chess-themes/pieces/light/150/' + piece.toLowerCase() + '.png'; } };
            board = Chessboard('board', config); $(window).resize(board.resize);
            
            $(document).on('mousedown touchstart', '#board .square-55d63', function(e) {
                e.preventDefault(); if (!gameActive) return;
                handleSquareClick($(this).attr('data-square'), $(this));
            });
        });

        // --- الدوال (إصلاح المساعد) ---
        function toggleHelper() { 
            isHelperActive = !isHelperActive; 
            if(isHelperActive) helperBtn.classList.add('selected'); else helperBtn.classList.remove('selected'); 
            applyHelperGlow(); 
        }
        
        function toggleFlip() { if (gameActive) return; isFlipped = !isFlipped; board.orientation(isFlipped ? 'black' : 'white'); applyHelperGlow(); }
        
        function selectTime(seconds, btn) {
            if (gameActive) return;
            selectedTime = seconds; timeLeft = seconds;
            optionsGrid.children[0].classList.remove('selected'); optionsGrid.children[1].classList.remove('selected');
            btn.classList.add('selected'); timerEl.innerText = seconds === 0 ? "∞" : seconds;
        }

        function clearBoardHighlights() { 
            // نمسح الألوان الصح والخطأ فقط ولا نتدخل في المساعد أبداً
            $('#board .square-55d63').removeClass('correct wrong'); 
        }
        
        function applyHelperGlow() { 
            // المساعد يتحكم بخصائصه فقط
            $('#board .square-55d63').removeClass('glow'); 
            if (isHelperActive && gameActive && currentTarget) { 
                $('#board .square-' + currentTarget).addClass('glow'); 
            } 
        }

        function nextSquare() {
            const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
            currentTarget = files[Math.floor(Math.random() * 8)] + (Math.floor(Math.random() * 8) + 1);
            targetOverlay.innerText = currentTarget; 
            applyHelperGlow(); // تحديث المساعد فوراً مع كل مربع جديد
        }

        function handleSquareClick(squareName, squareElement) {
            clearBoardHighlights();
            if (squareName === currentTarget) {
                score++; scoreEl.innerText = score;
                squareElement.addClass('correct');
                nextSquare(); // يتغير فوراً
                setTimeout(() => squareElement.removeClass('correct'), 150); 
            } else {
                squareElement.addClass('wrong');
                setTimeout(() => squareElement.removeClass('wrong'), 150);
            }
        }

        function startGame() {
            gameActive = true; score = 0; timeLeft = selectedTime; scoreEl.innerText = score;
            startBtn.style.display = 'none'; endBtn.style.display = 'flex'; 
            optionsGrid.style.opacity = '0.4'; optionsGrid.style.pointerEvents = 'none';
            targetOverlay.style.display = 'block';
            
            board.position('start', false);
            nextSquare();

            if (selectedTime > 0) {
                timerInterval = setInterval(() => { timeLeft--; timerEl.innerText = timeLeft; if (timeLeft <= 0) endGame(); }, 1000);
            } else { timerEl.innerText = "∞"; }
        }

        function endGame() {
            if (!gameActive) return; gameActive = false; clearInterval(timerInterval);
            targetOverlay.style.display = 'none'; 
            clearBoardHighlights();
            $('#board .square-55d63').removeClass('glow'); // مسح المساعد عند النهاية
            endBtn.style.display = 'none'; 
            document.getElementById('finalScoreText').innerText = score; endModal.style.display = 'flex';
        }

        function closeModalAndReset() {
            endModal.style.display = 'none'; startBtn.style.display = 'flex'; 
            optionsGrid.style.opacity = '1'; optionsGrid.style.pointerEvents = 'auto';
            if(selectedTime > 0) timerEl.innerText = selectedTime;
        }
    </script>
</body>
</html>
